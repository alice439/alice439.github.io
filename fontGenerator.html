<script>
(function(){
const canvas = document.getElementById('inkCanvas');
const ctx = canvas.getContext('2d');

const ARCHETYPES = [
  { name: 'Modernist Geometric Sans', style: 'sans', width: 1.0, xh: 1.0, nibWidth: 7, angle: 0, slant: 0, contrast: 'none', jitter: 0 },
  { name: 'Didone High-Contrast Serif', style: 'serif', width: 0.85, xh: 0.85, nibWidth: 16, angle: 90, slant: 0, contrast: 'extreme', jitter: 0 },
  { name: 'Heavy Poster Slab Serif', style: 'slab', width: 1.25, xh: 1.1, nibWidth: 22, angle: 0, slant: 0, contrast: 'low', jitter: 0 },
  { name: 'Gothic Blackletter Display', style: 'blackletter', width: 0.8, xh: 1.15, nibWidth: 18, angle: 45, slant: 0, contrast: 'high', jitter: 1 },
  { name: 'Ultra-Condensed Technical', style: 'condensed', width: 0.55, xh: 1.2, nibWidth: 5, angle: 0, slant: 0, contrast: 'none', jitter: 0 },
  { name: 'Extended Modern Art-Deco', style: 'artdeco', width: 1.6, xh: 0.65, nibWidth: 7, angle: 15, slant: 0, contrast: 'medium', jitter: 0 },
  { name: 'Organic Bubble Display', style: 'bubble', width: 1.1, xh: 1.1, nibWidth: 26, angle: 0, slant: 0, contrast: 'none', jitter: 2 },
  { name: 'Expressive Calligraphic Italic', style: 'script', width: 0.95, xh: 0.9, nibWidth: 14, angle: 35, slant: 18, contrast: 'high', jitter: 3 },
  { name: 'Cyberpunk Glitch Neon', style: 'cyber', width: 1.1, xh: 1.05, nibWidth: 6, angle: 10, slant: -5, contrast: 'none', jitter: 4 },
  { name: 'Brutalist Monospace Block', style: 'brutal', width: 1.3, xh: 1.2, nibWidth: 20, angle: 0, slant: 0, contrast: 'low', jitter: 1 },
  { name: 'Whimsical Comic Marker', style: 'comic', width: 1.0, xh: 1.1, nibWidth: 12, angle: 20, slant: 8, contrast: 'medium', jitter: 5 },
  { name: 'Victorian Ornamental Script', style: 'victorian', width: 0.9, xh: 0.8, nibWidth: 10, angle: 50, slant: 12, contrast: 'extreme', jitter: 2 }
];

let currentDNA = ARCHETYPES[0];
let fontSeed = Math.floor(Math.random() * 100000);

function pickRandomDNA() {
  fontSeed = Math.floor(Math.random() * 100000);
  const base = ARCHETYPES[Math.floor(Math.random() * ARCHETYPES.length)];
  currentDNA = { ...base,
    id: Math.floor(Math.random() * 899) + 100,
    width: Math.round((base.width + (Math.random() * 0.35 - 0.17)) * 100) / 100,
    xh: Math.round((base.xh + (Math.random() * 0.25 - 0.12)) * 100) / 100,
    slant: Math.random() > 0.6 ? Math.floor(Math.random() * 24 - 6) : base.slant,
    nibWidth: Math.max(3, Math.min(30, base.nibWidth + Math.floor(Math.random() * 6 - 3)))
  };
  document.getElementById('width').value = currentDNA.nibWidth;
  document.getElementById('angle').value = currentDNA.angle;
  document.getElementById('aspect').value = Math.round(currentDNA.width * 100);
  document.getElementById('xheight').value = Math.round(currentDNA.xh * 100);
  document.getElementById('slant').value = currentDNA.slant;
  document.getElementById('jitter').value = currentDNA.jitter;
  document.getElementById('dnaLabel').textContent = `✦ ${currentDNA.name}`;
  document.getElementById('dnaDetail').textContent = `id: ${currentDNA.id} | style: ${currentDNA.style} · width: ${currentDNA.width}×`;
}

function random(seed) { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); }

function hexToRgba(hex, alpha) {
  let c = hex.replace('#', '');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
}

function drawMaterialStroke(ctx, points, nibW, jitterAmt, material, opacityVal, colorHex) {
  if (points.length < 2) return;
  const baseAlpha = opacityVal / 100;
  ctx.save();

  if (material === 'watercolor') {
    // Soft outer wet bloom layers
    for (let layer = 0; layer < 4; layer++) {
      ctx.beginPath();
      ctx.lineWidth = nibW * (1.2 + layer * 0.5);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = hexToRgba(colorHex, baseAlpha * (0.08 / (layer + 1)));
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) {
        let px = points[i][0] + (random(fontSeed + i * 3 + layer * 19) - 0.5) * (nibW * 0.8);
        let py = points[i][1] + (random(fontSeed + i * 7 + layer * 23) - 0.5) * (nibW * 0.8);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    // Core concentrated watercolor pigment
    ctx.beginPath();
    ctx.lineWidth = Math.max(2, nibW * 0.7);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = hexToRgba(colorHex, baseAlpha * 0.55);
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.stroke();
    // Pigment pooling / water drops around strokes
    for (let i = 0; i < points.length; i += 2) {
      if (random(fontSeed + i * 31) > 0.5) {
        const dropRadius = random(fontSeed + i * 43) * (nibW * 0.6) + 1;
        const offsetX = (random(fontSeed + i * 53) - 0.5) * (nibW * 2.5);
        const offsetY = (random(fontSeed + i * 61) - 0.5) * (nibW * 2.5);
        ctx.fillStyle = hexToRgba(colorHex, baseAlpha * (0.15 + random(fontSeed + i) * 0.3));
        ctx.beginPath();
        ctx.arc(points[i][0] + offsetX, points[i][1] + offsetY, dropRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (material === 'paint') {
    // Thick Impasto body layer with shadow/highlight bristle ridges
    ctx.beginPath();
    ctx.lineWidth = nibW;
    ctx.lineCap = 'square';
    ctx.lineJoin = 'miter';
    ctx.strokeStyle = hexToRgba(colorHex, baseAlpha);
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.stroke();

    // Bristle tracks
    const bristleCount = Math.max(3, Math.floor(nibW * 0.7));
    for (let b = 0; b < bristleCount; b++) {
      const offset = (b / bristleCount - 0.5) * (nibW * 0.8);
      ctx.beginPath();
      ctx.lineWidth = Math.max(1, nibW / (bristleCount * 1.5));
      ctx.strokeStyle = b % 2 === 0 ? hexToRgba('#ffffff', baseAlpha * 0.35) : hexToRgba('#000000', baseAlpha * 0.4);
      ctx.moveTo(points[0][0] + offset, points[0][1] + offset);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0] + offset, points[i][1] + offset);
      ctx.stroke();
    }
  } else if (material === 'spray') {
    // Aerosol paint scatter simulation along path segments
    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      const p2 = points[i+1];
      const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const steps = Math.max(6, Math.floor(dist * 1.5));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const cx = p1[0] + (p2[0] - p1[0]) * t;
        const cy = p1[1] + (p2[1] - p1[1]) * t;
        const particleCount = Math.floor(nibW * 5);
        for (let p = 0; p < particleCount; p++) {
          const angle = random(fontSeed + p * 7 + s * 13) * Math.PI * 2;
          const radius = Math.pow(random(fontSeed + p * 17 + s * 3), 1.8) * (nibW * 1.2);
          const px = cx + Math.cos(angle) * radius;
          const py = cy + Math.sin(angle) * radius;
          const dotSize = random(fontSeed + p) * 1.6 + 0.5;
          ctx.fillStyle = hexToRgba(colorHex, baseAlpha * (1 - radius / (nibW * 1.3)));
          ctx.fillRect(px, py, dotSize, dotSize);
        }
      }
      // Spray drips
      if (random(fontSeed + i * 97) > 0.82) {
        const dripX = points[i][0];
        const dripY = points[i][1];
        const dripLen = random(fontSeed + i * 41) * 32 + 10;
        ctx.fillStyle = hexToRgba(colorHex, baseAlpha * 0.9);
        ctx.beginPath();
        ctx.rect(dripX - 1, dripY, 2, dripLen);
        ctx.arc(dripX, dripY + dripLen, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (material === 'charcoal') {
    // Textured graphite & rough particulate rendering
    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      const p2 = points[i+1];
      const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const steps = Math.max(5, Math.floor(dist * 1.2));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const cx = p1[0] + (p2[0] - p1[0]) * t;
        const cy = p1[1] + (p2[1] - p1[1]) * t;
        for (let p = 0; p < nibW * 3.5; p++) {
          const rx = (random(fontSeed + p * 5 + s * 7) - 0.5) * (nibW * 1.2);
          const ry = (random(fontSeed + p * 11 + s * 13) - 0.5) * (nibW * 1.2);
          if (random(fontSeed + p * 19) > 0.25) {
            ctx.fillStyle = hexToRgba(colorHex, baseAlpha * (0.2 + random(fontSeed + p) * 0.6));
            ctx.fillRect(cx + rx, cy + ry, 1.5, 1.5);
          }
        }
      }
    }
  } else {
    // Classic Fountain Ink (Smooth solid stroke with crisp edge falloff)
    ctx.beginPath();
    ctx.lineWidth = nibW;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = hexToRgba(colorHex, baseAlpha);
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      let px = points[i][0];
      let py = points[i][1];
      if (jitterAmt > 0) {
        px += (random(fontSeed + i * 7) - 0.5) * jitterAmt;
        py += (random(fontSeed + i * 13) - 0.5) * jitterAmt;
      }
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function arcPoints(cx, cy, rx, ry, startA, endA, steps) {
  steps = steps || 14;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const a = startA + (endA - startA) * (i / steps);
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}

function getGlyphStrokes(char, w, h, xh) {
  const baseW = 44 * w; const baseH = 70 * h;
  const xHeight = baseH * 0.55 * xh; const capTop = 10;
  const baseline = capTop + baseH; const xTop = baseline - xHeight;
  const midY = xTop + xHeight / 2; const stem = Math.round(baseW * 0.18);
  const cx = Math.round(baseW / 2);
  const c = char.toLowerCase();
  const strokes = [];
  const line = (x1, y1, x2, y2) => [[x1, y1], [x2, y2]];

  switch(c) {
    case 'a': strokes.push(arcPoints(cx, midY, baseW*0.34, xHeight*0.42, 0, Math.PI*2)); strokes.push(line(baseW-stem, xTop, baseW-stem, baseline)); break;
    case 'b': strokes.push(line(stem, capTop, stem, baseline)); strokes.push(arcPoints(cx+2, baseline - xHeight/2, baseW*0.34, xHeight/2, -Math.PI/2, Math.PI/2)); break;
    case 'c': strokes.push(arcPoints(cx, midY, baseW*0.35, xHeight*0.42, Math.PI*0.22, Math.PI*1.78)); break;
    case 'd': strokes.push(line(baseW-stem, capTop, baseW-stem, baseline)); strokes.push(arcPoints(cx-2, baseline - xHeight/2, baseW*0.34, xHeight/2, Math.PI/2, Math.PI*1.5)); break;
    case 'e': strokes.push(line(stem+2, midY, baseW-stem, midY)); strokes.push(arcPoints(cx, midY, baseW*0.34, xHeight*0.42, 0, -Math.PI * 1.75, 16)); break;
    case 'f': strokes.push(line(cx, capTop+10, cx, baseline)); strokes.push(arcPoints(cx+8, capTop+10, 8, 10, Math.PI, Math.PI*1.8)); strokes.push(line(cx-8, xTop+4, cx+10, xTop+4)); break;
    case 'g': strokes.push(arcPoints(cx, midY, baseW*0.34, xHeight*0.4, 0, Math.PI*2)); strokes.push(line(baseW-stem, midY, baseW-stem, baseline+14)); strokes.push(arcPoints(cx, baseline+14, baseW*0.34, 8, 0, Math.PI)); break;
    case 'h': strokes.push(line(stem, capTop, stem, baseline)); strokes.push(arcPoints(cx+2, xTop, baseW*0.34, xHeight*0.38, -Math.PI, 0)); strokes.push(line(baseW-stem, xTop, baseW-stem, baseline)); break;
    case 'i': strokes.push(line(cx, xTop, cx, baseline)); strokes.push(line(cx, capTop+2, cx, capTop+6)); break;
    case 'j': strokes.push(line(cx+4, xTop, cx+4, baseline+14)); strokes.push(arcPoints(cx-2, baseline+14, 6, 6, 0, Math.PI)); strokes.push(line(cx+4, capTop+2, cx+4, capTop+6)); break;
    case 'k': strokes.push(line(stem, capTop, stem, baseline)); strokes.push(line(stem+4, midY, baseW-stem, xTop+4)); strokes.push(line(stem+4, midY, baseW-stem, baseline)); break;
    case 'l': strokes.push(line(stem, capTop, stem, baseline)); strokes.push(line(stem, baseline, stem+10, baseline)); break;
    case 'm': strokes.push(line(stem, xTop, stem, baseline)); strokes.push(arcPoints(stem + baseW*0.24, xTop, baseW*0.22, xHeight*0.3, -Math.PI, 0)); strokes.push(arcPoints(baseW - baseW*0.24, xTop, baseW*0.22, xHeight*0.3, -Math.PI, 0)); strokes.push(line(baseW-stem, xTop, baseW-stem, baseline)); break;
    case 'n': strokes.push(line(stem, xTop, stem, baseline)); strokes.push(arcPoints(cx+2, xTop, baseW*0.34, xHeight*0.38, -Math.PI, 0)); strokes.push(line(baseW-stem, xTop, baseW-stem, baseline)); break;
    case 'o': strokes.push(arcPoints(cx, midY, baseW*0.36, xHeight*0.42, 0, Math.PI*2)); break;
    case 'p': strokes.push(line(stem, xTop, stem, baseline+18)); strokes.push(arcPoints(cx+2, baseline - xHeight/2, baseW*0.34, xHeight/2, -Math.PI/2, Math.PI/2)); break;
    case 'q': strokes.push(line(baseW-stem, xTop, baseW-stem, baseline+18)); strokes.push(arcPoints(cx-2, baseline - xHeight/2, baseW*0.34, xHeight/2, Math.PI/2, Math.PI*1.5)); break;
    case 'r': strokes.push(line(stem, xTop, stem, baseline)); strokes.push(arcPoints(cx-2, xTop+8, baseW*0.28, 8, Math.PI*1.2, Math.PI*1.9)); break;
    case 's': strokes.push(arcPoints(cx, xTop+8, baseW*0.32, 8, Math.PI*0.5, Math.PI*1.9)); strokes.push(arcPoints(cx, baseline-8, baseW*0.32, 8, Math.PI*2.5, Math.PI*3.9)); break;
    case 't': strokes.push(line(cx, capTop+4, cx, baseline)); strokes.push(line(cx-8, xTop+4, cx+8, xTop+4)); break;
    case 'u': strokes.push(line(stem, xTop, stem, baseline-8)); strokes.push(arcPoints(cx, baseline-8, baseW*0.34, 8, Math.PI, 0)); strokes.push(line(baseW-stem, xTop, baseW-stem, baseline)); break;
    case 'v': strokes.push(line(stem, xTop, cx, baseline)); strokes.push(line(cx, baseline, baseW-stem, xTop)); break;
    case 'w': strokes.push(line(stem, xTop, stem+6, baseline)); strokes.push(line(stem+6, baseline, cx, midY)); strokes.push(line(cx, midY, baseW-stem-6, baseline)); strokes.push(line(baseW-stem-6, baseline, baseW-stem, xTop)); break;
    case 'x': strokes.push(line(stem, xTop, baseW-stem, baseline)); strokes.push(line(baseW-stem, xTop, stem, baseline)); break;
    case 'y': strokes.push(line(stem, xTop, cx, midY)); strokes.push(line(baseW-stem, xTop, cx, midY)); strokes.push(line(cx, midY, cx, baseline+16)); break;
    case 'z': strokes.push(line(stem, xTop, baseW-stem, xTop)); strokes.push(line(baseW-stem, xTop, stem, baseline)); strokes.push(line(stem, baseline, baseW-stem, baseline)); break;
    case '0': strokes.push(arcPoints(cx, (capTop+baseline)/2, baseW*0.34, baseH*0.45, 0, Math.PI*2)); break;
    case '1': strokes.push(line(cx-6, capTop+10, cx, capTop)); strokes.push(line(cx, capTop, cx, baseline)); strokes.push(line(cx-10, baseline, cx+10, baseline)); break;
    case '2': strokes.push(arcPoints(cx, capTop+12, baseW*0.32, 12, -Math.PI, 0)); strokes.push(line(baseW-stem, capTop+12, stem, baseline)); strokes.push(line(stem, baseline, baseW-stem, baseline)); break;
    case '3': strokes.push(arcPoints(cx, capTop+12, baseW*0.3, 12, -Math.PI, 0)); strokes.push(arcPoints(cx, baseline-12, baseW*0.34, 12, 0, Math.PI)); break;
    case '4': strokes.push(line(baseW-stem-4, capTop, stem, (capTop+baseline)/2)); strokes.push(line(stem, (capTop+baseline)/2, baseW-stem, (capTop+baseline)/2)); strokes.push(line(baseW-stem-4, capTop, baseW-stem-4, baseline)); break;
    case '5': strokes.push(line(baseW-stem, capTop, stem+4, capTop)); strokes.push(line(stem+4, capTop, stem+2, (capTop+baseline)/2 - 2)); strokes.push(arcPoints(cx, baseline-14, baseW*0.32, 12, -Math.PI/2, Math.PI*0.8)); break;
    case '6': strokes.push(arcPoints(cx, baseline-16, baseW*0.32, 14, 0, Math.PI*2)); strokes.push(line(stem+2, baseline-16, cx+4, capTop)); break;
    case '7': strokes.push(line(stem, capTop, baseW-stem, capTop)); strokes.push(line(baseW-stem, capTop, stem+4, baseline)); break;
    case '8': strokes.push(arcPoints(cx, capTop+18, baseW*0.28, 16, 0, Math.PI*2)); strokes.push(arcPoints(cx, baseline-18, baseW*0.32, 16, 0, Math.PI*2)); break;
    case '9': strokes.push(arcPoints(cx, capTop+16, baseW*0.32, 14, 0, Math.PI*2)); strokes.push(line(baseW-stem-2, capTop+16, cx-4, baseline)); break;
    default: strokes.push(line(cx, xTop, cx, baseline)); break;
  }
  return { strokes, width: baseW + 16 };
}

function renderInk() {
  const text = document.getElementById('inkTextInput').value;
  const material = document.getElementById('materialType').value;
  const opacityVal = parseInt(document.getElementById('opacity').value, 10);
  const nibW = parseInt(document.getElementById('width').value, 10);
  const slant = parseInt(document.getElementById('slant').value, 10);
  const spacing = parseInt(document.getElementById('spacing').value, 10) / 100;
  const jitter = parseInt(document.getElementById('jitter').value, 10);
  const inkColor = document.getElementById('inkColor').value;
  const paperColor = document.getElementById('paperColor').value;

  document.getElementById('v-opacity').textContent = `${opacityVal}%`;
  document.getElementById('v-width').textContent = nibW;
  document.getElementById('v-angle').textContent = `${document.getElementById('angle').value}°`;
  document.getElementById('v-aspect').textContent = `${(document.getElementById('aspect').value/100).toFixed(1)}×`;
  document.getElementById('v-xheight').textContent = `${(document.getElementById('xheight').value/100).toFixed(1)}×`;
  document.getElementById('v-slant').textContent = `${slant}°`;
  document.getElementById('v-spacing').textContent = `${spacing.toFixed(1)}×`;
  document.getElementById('v-jitter').textContent = jitter;
  document.getElementById('v-bleed').textContent = `${document.getElementById('bleed').value}%`;

  const aspect = parseInt(document.getElementById('aspect').value, 10) / 100;
  const xh = parseInt(document.getElementById('xheight').value, 10) / 100;

  canvas.width = 900;
  canvas.height = 350;

  ctx.fillStyle = paperColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let cursorX = 38;
  let cursorY = 115;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === ' ') { cursorX += 22 * spacing; continue; }

    const glyph = getGlyphStrokes(char, aspect, 1.0, xh);
    ctx.save();
    ctx.translate(cursorX, cursorY);
    if (slant !== 0) ctx.transform(1, 0, Math.tan((slant * Math.PI) / 180), 1, 0, 0);

    glyph.strokes.forEach(stroke => {
      drawMaterialStroke(ctx, stroke, nibW, jitter, material, opacityVal, inkColor);
    });

    ctx.restore();
    cursorX += glyph.width * spacing;

    if (cursorX > canvas.width - 60) { cursorX = 38; cursorY += 98; }
  }

  document.getElementById('footInfoInk').textContent = `${currentDNA.name} · material: ${material} · ${nibW}px nib`;
}

document.getElementById('generateBtn').addEventListener('click', () => { pickRandomDNA(); renderInk(); });
['materialType','opacity','width','angle','aspect','xheight','slant','spacing','jitter','bleed','inkColor','paperColor'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderInk);
});
document.getElementById('inkTextInput').addEventListener('input', renderInk);
document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `${currentDNA.name.toLowerCase().replace(/\s+/g, '-')}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});

pickRandomDNA();
renderInk();
})();
</script>
