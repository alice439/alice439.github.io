<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-outer: #dbeafe;
    --window-border: #6b8b9e;
    --header-bg: #b3d4e5;
    --tab-inactive: #eaf2f6;
    --tab-active: #8bbad1;
    --card-bg: #f9fcff;
    --text-color: #3b4e58;
    --accent-blue: #709fb0;
  }

  body {
    background-color: var(--bg-outer);
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: var(--text-color);
  }

  /* Main Browser Window */
  .browser-window {
    width: 600px;
    background: var(--card-bg);
    border: 4px solid var(--window-border);
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  /* Title Bar */
  .title-bar {
    background: var(--header-bg);
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid var(--window-border);
  }

  .url-bar {
    background: #ffffff;
    border: 2px solid var(--window-border);
    border-radius: 12px;
    padding: 4px 12px;
    width: 70%;
    font-size: 14px;
    text-align: center;
  }

  /* Tabs */
  .tabs-container {
    display: flex;
    gap: 8px;
    background: #e1eef5;
    padding: 6px 12px 0 12px;
    border-bottom: 2px dashed var(--window-border);
  }

  .tab {
    background: var(--tab-inactive);
    padding: 6px 16px;
    border-radius: 10px 10px 0 0;
    border: 2px solid var(--window-border);
    border-bottom: none;
    font-size: 14px;
    font-weight: bold;
  }

  .tab.active {
    background: var(--tab-active);
    color: white;
  }

  /* Main Content Area */
  .content {
    padding: 16px;
  }

  .info-box {
    background: #ffffff;
    border: 2px solid var(--window-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .badge {
    background: var(--accent-blue);
    color: white;
    padding: 4px 10px;
    border-radius: 8px;
    display: inline-block;
    font-size: 12px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="browser-window">
  <div class="title-bar">
    <div class="url-bar">https://titlehere.com</div>
  </div>

  <div class="tabs-container">
    <div class="tab active">about</div>
    <div class="tab">comms</div>
    <div class="tab">T.o.S</div>
  </div>

  <div class="content">
    <div class="info-box">
      <span class="badge">Find Me Here!</span>
      <p style="margin-top: 8px;">Place your original text and vector icons here.</p>
    </div>
  </div>
</div>

</body>
</html>
